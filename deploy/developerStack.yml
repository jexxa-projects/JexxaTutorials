version: "3.8"

services:
  ActiveMQ:
    image: apache/activemq-artemis
    ports:
      - "61616:61616"
      - "8161:8161"
    environment:
      AMQ_USER: admin
      AMQ_PASSWORD: admin
      AMQ_EXTRA_ARGS: --relax-jolokia

  Postgres:
    image: postgres:latest
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

  SwaggerUI:
    image: swaggerapi/swagger-ui:latest
    restart: always
    ports:
      - '8080:8080'

volumes:
  postgres-data:
